    // State
    let currentLang = 'ja';
    let currentQuestion = 0;
    let answers = [];

    // Language switcher
    function setLang(lang) {
      currentLang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang] && i18n[lang][key]) {
          el.textContent = i18n[lang][key];
        }
      });
      // Update active state
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.remove('bg-gold/20');
        if (btn.getAttribute('data-lang') === lang) {
          btn.classList.add('bg-gold/20');
        }
      });
      // Re-render current question if on question screen
      if (document.getElementById('question-screen').classList.contains('active')) {
        renderQuestion();
      }
    }

    // Mobile menu toggle
    function toggleMobileMenu() {
      const menu = document.getElementById('mobile-menu');
      menu.classList.toggle('hidden');
    }

    // Start quiz
    function startQuiz() {
      currentQuestion = 0;
      answers = [];
      showScreen('question-screen');
      document.getElementById('progress-container').classList.remove('hidden');
      renderQuestion();
    }

    // Render question
    function renderQuestion() {
      const q = questions[currentQuestion];
      const lang = currentLang;
      
      document.getElementById('current-q').textContent = currentQuestion + 1;
      document.getElementById('question-text').textContent = i18n[lang][q.key];
      
      const choicesContainer = document.getElementById('choices');
      choicesContainer.innerHTML = '';
      
      q.answers.forEach((ansKey, idx) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn bg-white p-6 rounded-2xl border border-charcoal/10 text-center hover:border-gold/50';
        btn.innerHTML = `<span class="text-lg">${i18n[lang][ansKey]}</span>`;
        btn.onclick = () => selectAnswer(q.values[idx]);
        choicesContainer.appendChild(btn);
      });
      
      // Update progress bar
      const progress = ((currentQuestion) / questions.length) * 100;
      document.getElementById('progress-bar').style.width = progress + '%';
    }

    // Select answer
    function selectAnswer(value) {
      answers.push(value);
      
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuestion();
      } else {
        // Show result
        document.getElementById('progress-bar').style.width = '100%';
        setTimeout(() => {
          showResult();
        }, 300);
      }
    }

    // Calculate result based on answers
    function calculateRecipe() {
      const [mood, season, place, time, intensity] = answers;
      
      // Map combinations to recipes
      if (mood === 'fresh' && (time === 'morning' || time === 'afternoon')) return 'fresh-morning';
      if (mood === 'romantic' && place === 'flower') return 'romantic-flower';
      if (mood === 'mysterious' && (time === 'night' || time === 'evening')) return 'mysterious-night';
      if (mood === 'natural' && place === 'forest') return 'natural-forest';
      if (season === 'summer' && place === 'beach') return 'summer-beach';
      if (place === 'cafe' && (time === 'afternoon' || time === 'evening')) return 'autumn-cafe';
      if (season === 'winter' && time === 'evening') return 'winter-evening';
      if (season === 'spring' && intensity === 'light') return 'spring-light';
      
      // Default fallbacks based on mood
      const moodMap = {
        'fresh': 'fresh-morning',
        'romantic': 'romantic-flower',
        'mysterious': 'mysterious-night',
        'natural': 'natural-forest'
      };
      return moodMap[mood] || 'fresh-morning';
    }

    // Show result
    function showResult() {
      const recipeKey = calculateRecipe();
      const recipe = recipes[recipeKey];
      const lang = currentLang;
      
      document.getElementById('result-name').textContent = recipe.name[lang];
      document.getElementById('result-description').textContent = recipe.desc[lang];
      document.getElementById('result-circle').style.background = recipe.gradient;
      
      // Render recipe list
      const recipeList = document.getElementById('recipe-list');
      recipeList.innerHTML = `
        <h3 class="text-sm text-charcoal/50 mb-4 tracking-wide">${lang === 'ja' ? '調合レシピ' : 'Recipe'}</h3>
        ${recipe.ingredients.map(ing => `
          <div class="flex items-center justify-between py-2 border-b border-charcoal/10 last:border-0">
            <span class="text-charcoal">${ing.name[lang]}</span>
            <span class="text-gold font-medium">${ing.percent}%</span>
          </div>
        `).join('')}
      `;
      
      document.getElementById('progress-container').classList.add('hidden');
      showScreen('result-screen');
    }

    // Reset quiz
    function resetQuiz() {
      showScreen('welcome-screen');
    }

    // Show screen
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });
      document.getElementById(screenId).classList.add('active');
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      setLang('ja');
    });
  </script>
